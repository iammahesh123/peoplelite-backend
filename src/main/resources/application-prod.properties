spring.application.name=hr-lite-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/hrlite}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mahesh}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.flyway.enabled=true
spring.flyway.validate-on-migrate=true

server.port=8080
server.servlet.context-path=/
server.compression.enabled=true
server.compression.min-response-size=1024
server.error.include-message=always
server.error.include-stacktrace=never

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.export.simple.enabled=true

logging.level.root=WARN
logging.level.com.hrlite=INFO
logging.level.org.springframework.web=WARN

logging.pattern.console=[%d{ISO8601}] [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=[%d{ISO8601}] [%thread] %-5level %logger{36} - %msg%n

logging.file.name=/app/logs/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

app.jwt.secret=${JWT_SECRET:384910119451-19niqmgqalj5upk044s5hjms8636n1f2.apps.googleusercontent.com}
app.jwt.expiration=86400000

app.cors.origins=${CORS_ORIGINS:https://peoplelite.vercel.app}

app.s3.enabled=${S3_ENABLED:false}
app.s3.bucket=${S3_BUCKET:hr-lite-docs}
app.s3.region=${S3_REGION:ap-south-1}
app.s3.endpoint=${S3_ENDPOINT:https://s3.amazonaws.com}

app.mail.host=${MAIL_HOST:smtp.gmail.com}
app.mail.port=${MAIL_PORT:587}
